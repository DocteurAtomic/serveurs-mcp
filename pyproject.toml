[project]
name = "pachatraining-mcp"
version = "0.1.0"
description = "An MCP server over the PachadataTraining database"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]==2.3.0",
    "mssql-python==1.17.0",
]

[project.scripts]
pachatraining-mcp = "pachatraining_mcp.server:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
